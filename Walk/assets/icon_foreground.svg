<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="432" height="432">
  <!-- Hour hand at 4 o'clock -->
  <line x1="54" y1="54" x2="76" y2="76" stroke="#999" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Minute hand at 12 -->
  <line x1="54" y1="54" x2="54" y2="19" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle cx="54" cy="54" r="3.5" fill="#aaa"/>

  <!-- "16h" centered, baseline aligned -->
  <text x="46" y="69" font-family="Helvetica, Arial, sans-serif" font-size="50" font-weight="400" fill="#ffffff" text-anchor="middle">16</text>
  <text x="76" y="69" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#cccccc" text-anchor="start">h</text>
</svg>
